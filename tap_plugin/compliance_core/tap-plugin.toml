manifest_version = "0"
plugin_version = "0.8.10" # x-release-please-version
requires_tap = ">=0.3.0"
slug = "compliance_core"
name = "TAP Compliance Core"
description = "Regime-agnostic compliance vocabulary — artifacts, per-regime context, evidence, findings, exceptions, and boundaries that every compliance regime (FedRAMP 20x, SOC2, CMMC, ISO 27001) shares. Substrate; consumers depend on it downward."

# Regime-agnostic compliance vocabulary: the fetched-document artifact, per-regime
# posture context, and the shared evidence / finding / exception / boundary nodes with
# their edges (see specs/spec-compliance-core-v0.md, req-compliance-core-migration).
[models]
compliance_core__compliance_artifact = "tap_plugin.compliance_core.models.compliance_artifact.ComplianceArtifact"
compliance_core__compliance_context = "tap_plugin.compliance_core.models.compliance_context.ComplianceContext"
compliance_core__compliance_evidence = "tap_plugin.compliance_core.models.compliance_evidence.ComplianceEvidence"
compliance_core__compliance_finding = "tap_plugin.compliance_core.models.compliance_finding.ComplianceFinding"
compliance_core__compliance_exception = "tap_plugin.compliance_core.models.compliance_exception.ComplianceException"
compliance_core__compliance_exception_instance = "tap_plugin.compliance_core.models.compliance_exception_instance.ComplianceExceptionInstance"
compliance_core__compliance_search_snapshot = "tap_plugin.compliance_core.models.compliance_search_snapshot.ComplianceSearchSnapshot"
compliance_core__compliance_boundary = "tap_plugin.compliance_core.models.compliance_boundary.ComplianceBoundary"
compliance_core__compliance_vulnerability = "tap_plugin.compliance_core.models.compliance_vulnerability.ComplianceVulnerability"
compliance_core__compliance_scanner = "tap_plugin.compliance_core.models.compliance_scanner.ComplianceScanner"
compliance_core__compliance_scan_run = "tap_plugin.compliance_core.models.compliance_scan_run.ComplianceScanRun"

[edges]
CITES_COMPLIANCE_EVIDENCE__compliance_core = "edges/CITES_COMPLIANCE_EVIDENCE.edge.json"
COVERS_COMPLIANCE_FINDING__compliance_core = "edges/COVERS_COMPLIANCE_FINDING.edge.json"
CARRIES_COMPLIANCE_FINDING__compliance_core = "edges/CARRIES_COMPLIANCE_FINDING.edge.json"
SCOPED_TO_COMPLIANCE_BOUNDARY__compliance_core = "edges/SCOPED_TO_COMPLIANCE_BOUNDARY.edge.json"
CONCERNS_COMPLIANCE_CONTROL__compliance_core = "edges/CONCERNS_COMPLIANCE_CONTROL.edge.json"
CONCERNS_COMPLIANCE_VULNERABILITY__compliance_core = "edges/CONCERNS_COMPLIANCE_VULNERABILITY.edge.json"
PERFORMS_COMPLIANCE_SCAN_RUN__compliance_core = "edges/PERFORMS_COMPLIANCE_SCAN_RUN.edge.json"
REPORTS_COMPLIANCE_FINDING__compliance_core = "edges/REPORTS_COMPLIANCE_FINDING.edge.json"
DETECTS_COMPLIANCE_FINDING__compliance_core = "edges/DETECTS_COMPLIANCE_FINDING.edge.json"
RUNS_AT_LOCATION__compliance_core = "edges/RUNS_AT_LOCATION.edge.json"
SCANNED_COMPLIANCE_TARGET__compliance_core = "edges/SCANNED_COMPLIANCE_TARGET.edge.json"
GRANTS_COMPLIANCE_EXCEPTION_INSTANCE__compliance_core = "edges/GRANTS_COMPLIANCE_EXCEPTION_INSTANCE.edge.json"
EXEMPTS_COMPLIANCE_VULNERABILITY__compliance_core = "edges/EXEMPTS_COMPLIANCE_VULNERABILITY.edge.json"
SCOPED_TO_COMPLIANCE_EXCEPTION_TARGET__compliance_core = "edges/SCOPED_TO_COMPLIANCE_EXCEPTION_TARGET.edge.json"
CAPTURES_SEARCH__compliance_core = "edges/CAPTURES_SEARCH.edge.json"

# Module Search runners (req-compliance-core-searches). Registered under the runner's module scope,
# so a Search stores `tap_plugin.compliance_core.searches.cross_tabs:<key>`.
[searches]
vulnerability-components = "tap_plugin.compliance_core.searches.cross_tabs.vulnerability_components"
component-severity = "tap_plugin.compliance_core.searches.cross_tabs.component_severity"
findings-reached-count = "tap_plugin.compliance_core.searches.reach.findings_reached_count"
findings-reached-list = "tap_plugin.compliance_core.searches.reach.findings_reached_list"
dimension-coverage = "tap_plugin.compliance_core.searches.dimension_coverage.dimension_coverage"
dimension-mapping-summary = "tap_plugin.compliance_core.searches.dimension_mapping.dimension_mapping_summary"
dimension-mapping-entities = "tap_plugin.compliance_core.searches.dimension_mapping.dimension_mapping_entities"
finding-exception-coverage = "tap_plugin.compliance_core.searches.exception_coverage.finding_exception_coverage"
search-snapshot-series = "tap_plugin.compliance_core.searches.snapshot_series.search_snapshot_series"
dimension-mapping-totals = "tap_plugin.compliance_core.searches.dimension_mapping_totals.dimension_mapping_totals"
dimension-mapping-totals-set = "tap_plugin.compliance_core.searches.dimension_mapping_totals.dimension_mapping_totals_set"
exceptions-due-review = "tap_plugin.compliance_core.searches.exception_coverage.exceptions_due_review"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure + self, offline, credential-free. The consumer flips self to editable."
